<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
            background: #ffffff !important;
        }
        #rich-editor {
            min-height: 100vh;
            padding: 32px 48px 120px;
            max-width: 720px;
            margin: 0 auto;
            outline: none;
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
            caret-color: #000000;
        }
        #rich-editor p, #rich-editor span, #rich-editor div, #rich-editor li, #rich-editor td, #rich-editor th,
        #rich-editor b, #rich-editor strong, #rich-editor i, #rich-editor em, #rich-editor u, #rich-editor font {
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
        }
        #rich-editor p { margin-bottom: 16px; }
        #rich-editor img { max-width: 100%; height: auto; border-radius: 12px; margin: 16px 0; }
    </style>
</head>
<body>
    <div id="rich-editor" contenteditable="true" spellcheck="true"><p><br></p></div>
</body>
</html>
