<!DOCTYPE html>
<html lang="pt-BR" data-selbetti-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIS | SELBETTI — Hub do técnico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/selbetti.css?v=hub31">
</head>
<body class="selbetti-hub-body">
    <!-- Overlay vidro (menu aberto) -->
    <div class="selbetti-overlay" id="selbetti-overlay" aria-hidden="true" hidden></div>

    <!-- Menu lateral (fundo transparente + vidro) -->
    <aside class="selbetti-drawer" id="selbetti-drawer" aria-label="Menu principal SELBETTI" hidden>
        <div class="selbetti-drawer-inner glass-panel">
            <div class="selbetti-drawer-head">
                <span class="selbetti-drawer-brand">SELBETTI</span>
                <button type="button" class="selbetti-icon-btn" id="selbetti-drawer-close" aria-label="Fechar menu"><i class="fas fa-times"></i></button>
            </div>
            <nav class="selbetti-nav" id="selbetti-nav-root"></nav>
        </div>
    </aside>

    <input type="file" id="selbetti-file-input" hidden multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.heic,.heif,.doc,.docx,.xls,.xlsx,.txt,.csv,.mp4,.webm,.mov,.mkv,video/*,image/*">

    <header class="selbetti-topbar glass-panel">
        <div class="selbetti-topbar-left">
            <button type="button" class="selbetti-icon-btn selbetti-menu-btn" id="selbetti-menu-open" aria-label="Abrir menu" aria-expanded="false">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        <div class="selbetti-topbar-center">
            <h1 class="selbetti-logo-title">SELBETTI</h1>
        </div>
        <div class="selbetti-topbar-right">
            <button type="button" class="selbetti-icon-btn" id="selbetti-theme-toggle" aria-label="Tema claro ou escuro"><i class="fas fa-moon" id="selbetti-theme-icon"></i></button>
        </div>
    </header>

    <main class="selbetti-main" id="selbetti-main">
        <!-- Preenchido por selbetti-hub.js -->
    </main>

    <div class="selbetti-toast" id="selbetti-toast" role="status" aria-live="polite" hidden></div>

    <!-- Pré-visualização PDF / imagem (fundo vidro, estilo documentação Suporte) -->
    <div class="selbetti-doc-preview-backdrop" id="selbetti-doc-preview" hidden>
        <div class="selbetti-doc-preview-dialog glass-panel" id="selbetti-doc-preview-dialog" role="dialog" aria-modal="true" aria-labelledby="selbetti-doc-preview-title">
            <div class="selbetti-doc-preview-head">
                <h3 id="selbetti-doc-preview-title"></h3>
                <button type="button" class="selbetti-icon-btn" id="selbetti-doc-preview-close" aria-label="Fechar"><i class="fas fa-times"></i></button>
            </div>
            <div class="selbetti-doc-preview-body">
                <iframe id="selbetti-doc-preview-iframe" class="selbetti-doc-preview-frame" title="Pré-visualização do documento"></iframe>
                <img id="selbetti-doc-preview-img" class="selbetti-doc-preview-img" alt="" hidden>
                <p id="selbetti-doc-preview-fallback" class="selbetti-doc-preview-fallback" hidden></p>
            </div>
        </div>
    </div>

    <script src="../js/selbetti-chrome-runtime-shim.js?v=1"></script>
    <script src="../js/selbetti-hub.js?v=hub34"></script>
</body>
</html>
